 case'hermit':return p.alive&&p.atkN==0&&p.thr<=K.HERMIT_THR&&p.res>=K.HERMIT_RES;case'gamble':return p.bspent>=K.GAMB_SPENT&&p.hits>=K.GAMB_HITS;case'obs':return nC(p,3)>=6||nC(p,4)>=4;default:return true}}
function vp(p){const rpv=p.goal=='cap'?K.CAP_RPV:K.RES_PER_VP,kv=p.goal=='hunter'?K.HUNTER_KILL_VP:K.KILL_VP;
 let gv=p.goal=='dbl'?Math.min(p.beti,K.DBL_MAX)*K.DBL_EACH:(gok(p)?(GV[p.goal]??8):0);if(p.goal=='guard')gv+=Math.min(p.gprog,K.GUARD_VP_CAP)*K.GUARD_VP;
 return Math.floor((p.alive?5:0)+Math.floor(p.res/rpv)+p.kills*kv+gv+Math.min(4,p.predOk)+p.pvp+p.svp+p.evp+infoVP(p)+.5)}
function vpParts(p){const rpv=p.goal=='cap'?K.CAP_RPV:K.RES_PER_VP,kv=p.goal=='hunter'?K.HUNTER_KILL_VP:K.KILL_VP,ok=gok(p),full=GV[p.goal]??8;
 let gv=p.goal=='dbl'?Math.min(p.beti,K.DBL_MAX)*K.DBL_EACH:(ok?full:0),gn=p.goal=='dbl'?`背叛 ${Math.min(p.beti,K.DBL_MAX)} 次 × ${K.DBL_EACH}`:ok?(G.phase=='over'?'已達成':'目前符合（要保持到最後）'):`未達成（達成可得 ${full}）`;
 if(p.goal=='guard'){const g=Math.min(p.gprog,K.GUARD_VP_CAP)*K.GUARD_VP;if(g){gv+=g;gn+=`；守護成功 +${g}`}}

  ['擊殺',p.kills*kv,`淘汰 ${p.kills} 人，每人 ${kv}`],['預測',pr,`猜中 ${p.predOk+p.pvp} 次`+(p.role=='prophet'?'（預言家沒有上限）':'（最多 4 分）')],['情報',iv,`手上 ${p.hand.length} 張`]].concat(p.svp?[['走私',p.svp,`走私 ${p.suse} 次`]]:[]).concat(p.evp?[['死裡逃生',p.evp,'技能另外加分']]:[])}

 tutCheck();if(G.phase!='act')UI.tab='act';
 const pd=G.pend,cancel=`<button class="ghost" onclick="G.pend=null;render()">取消</button>`;
 const targets=()=>al().filter(p=>p.i&&!(pd&&pd.k=='inc'&&p.i==pd.t)).map(p=>`<button onclick="tg(${p.i})">${p.n}</button>`).join('')+cancel;
 let pk='';
 const noAP=m.ap<1&&!(pd&&pd.k==3&&merchFree(m));
 if(pd&&pd.t==null&&(pd.k==2||pd.k==3||pd.k==5))pk=`<div class="choice"><p>${pd.k==2?'觀察誰？':pd.k==3?(noAP?'選一個技能（不耗 AP）':'和誰交易？'):'攻擊誰？'}</p><div class="opts">${pd.k==3&&noAP&&!stratOK(m)?'':targets().replace(cancel,'')}${pd.k==2&&deepOK(m)?`<button onclick="doDeep()">細緻觀察：隨機一人的全部行動（剩 ${K.DEEP_USES-m.deep} 次）</button>`:''}${pd.k==3&&gambleOK(m)?`<button onclick="G.pend={k:'gmb'};render()">賭博（不耗 AP）</button>`:''}${cancel}</div>${pd.k==3&&noAP&&stratOK(m)?'<p class="hint">AP 用完了，但還可以對一名玩家使用「謀略」。</p>':''}</div>`;
 if(pd&&pd.k==0)pk=`<div class="choice"><p>採集選單</p><div class="opts">${m.ban>0?'':'<button onclick="doCollect()">採集</button>'}<button onclick="doEscape()">死裡逃生：花 1 AP 得 ${K.TOUGH_ESC_VP} VP（整局一次）</button>${cancel}</div></div>`;
 if(pd&&pd.k==4)pk=`<div class="choice"><p>防禦選單</p><div class="opts">${m.ap>=1?`<button onclick="doDefend()">防禦自己：1 AP，防禦 +${K.DEFEND_BONUS}</button>`:''}<button onclick="doGuard()">守護 ${G.P[m.tgt].n}：不耗 AP，付 ${K.GUARD_COST} 資源，他防禦 +${K.GUARD_PLUS}</button>${cancel}</div></div>`;
 if(pd&&pd.k=='gmb'&&pd.x==null){const mx=Math.min(Math.floor(m.res),K.GAMBLE_X_MAX,8);pk=`<div class="choice"><p>賭博：投入多少資源？</p><p class="hint">猜奇偶：猜中（1/2 機率）拿回 ${K.GAMBLE_WIN} 倍，猜錯拿回 ${K.GAMBLE_LOSE} 倍（都無條件捨去）。</p><div class="opts">${[...Array(mx).keys()].map(i=>`<button onclick="G.pend.x=${i+1};render()">${i+1}</button>`).join('')}${cancel}</div></div>`}
 if(pd&&pd.k=='gmb'&&pd.x!=null)pk=`<div class="choice"><p>投入 ${pd.x} 資源，系統會開出 1～10 的數字，猜：</p><div class="opts"><button onclick="doGamble(${pd.x},1)">奇數（拿回 ${Math.floor(pd.x*K.GAMBLE_WIN)} 或 ${Math.floor(pd.x*K.GAMBLE_LOSE)}）</button><button onclick="doGamble(${pd.x},0)">偶數（拿回 ${Math.floor(pd.x*K.GAMBLE_WIN)} 或 ${Math.floor(pd.x*K.GAMBLE_LOSE)}）</button>${cancel}</div></div>`;
 if(pd&&pd.k=='inc'&&pd.v==null&&pd.t!=null)pk=`<div class="choice"><p>挑撥：讓 ${G.P[pd.t].n} 對誰記仇？</p><div class="opts">${targets()}</div></div>`;
 if(pd&&pd.k==3&&pd.t!=null){const q=G.P[pd.t];const ta=m.ap>=1||merchFree(m);pk=`<div class="choice"><p>與 ${q.n} 交易${merchFree(m)?`<small>　行商：這次不耗 AP（剩 ${K.MERCH_FREE-m.mfree} 次）</small>`:''}</p><div class="opts">${ta?`<button onclick="trade(0)">公平：付 1 資源拿 1 張情報</button><button onclick="trade(1)">承諾：他付 1 資源，你保證不攻擊他${trust(m)?'（不能拒絕）':''}</button>`:''}${stratOK(m)?[1,2].map(x=>`<button onclick="doScheme(${x},1)">謀略：他付 ${x}，你攻擊 +${x}</button><button onclick="doScheme(${x},0)">謀略：他付 ${x}，你防禦 +${x}</button>`).join(''):''}${ta&&m.goal=='manip'&&m.mt<K.FORCE_USES&&m.res>=3&&q.res>=2?`<button onclick="trade(2)">強制交易：付 3 換 5</button>`:''}${ta&&m.goal=='manip'&&m.inc<K.INCITE_USES?`<button onclick="trade(3)">挑撥</button>`:''}${ta&&m.role=='smuggler'&&m.suse<K.SMUGGLER_MAX&&m.hand.length>=3?`<button onclick="trade(4)">走私：3 張情報換 ${K.SMUGGLE_VP} VP</button>`:''}${cancel}</div></div>`}
 if(pd&&pd.k==5&&pd.t!=null){const t=pd.t,q=G.P[t],mx=Math.min(bcap(m),m.res),bt=G.prom.has('0_'+t);const hmv=pd.hm&&huntOK(m);pk=`<div class="choice"><p>攻擊 ${q.n}（生命 ${q.hp}）：花多少資源備戰？</p>${huntOK(m)?`<label class="chk"><input type="checkbox" ${hmv?'checked':''} onchange="G.pend.hm=this.checked;render()"> 使用「獵殺時刻」：這次攻擊 +${K.HUNT_MOMENT_PLUS}（整局一次，全場會收到通知）</label>`:''}<p class="hint">攻擊值 ≥ 他的防禦值就打中，扣他 1 生命。他的防禦值 = ${K.DEF_BASE}＋這回合防禦的次數。</p><div class="opts">${[...Array(mx+1).keys()].map(b=>`<button onclick="atk(${b})">備戰 +${b}（攻擊 ${K.ATK_BASE+b+(hmv?K.HUNT_MOMENT_PLUS:0)+m.sba}）</button>`).join('')}${cancel}</div>${bt?'<p class="note">你承諾過不攻擊他，這次攻擊會算背叛，信用會下降。</p>':''}</div>`}
 if(pd&&pd.k=='sell')pk=pd.t==null?`<div class="choice"><p>這張情報賣給誰？（對方付 2 資源，你得 ${K.BROKER_GAIN} 資源）</p><div class="opts">${targets()}</div></div>`:'';
 const sellUI=m.role=='broker'&&m.alive&&!m.ruse&&m.buse<K.BROKER_MAX&&G.phase=='act'&&!pd&&G.intel.length?`<div class="extra"><small>情報商賣出（不耗 AP，剩 ${K.BROKER_MAX-m.buse} 次）</small>${G.intel.slice(0,4).map((c,i)=>`<button onclick="sellStart(${i})">${c.t}（${iR(c)}）</button>`).join('')}</div>`:'';
 const stratUI=G.deepMsg&&G.phase=='act'?`<div class="extra"><small>🔍 細緻觀察</small><p>${G.deepMsg}</p></div>`:'';
 const off=G.phase=='offers'?(trust(G.P[G.offers[0]])?`<div class="choice"><p>${G.P[G.offers[0]].n} 的信用很高（守約者「信任」）：這份承諾不能拒絕。你付 1 資源，他保證本回合不攻擊你。</p><div class="opts"><button onclick="offer(1)">知道了</button></div></div>`:`<div class="choice"><p>${G.P[G.offers[0]].n} 提議：你付 1 資源，他保證本回合不攻擊你</p><div class="opts"><button onclick="offer(1)" ${m.res<1?'disabled':''}>接受</button><button class="ghost" onclick="offer(0)">拒絕</button></div></div>`)
  :G.phase=='ioffers'?`<div class="choice"><p>情報商 ${G.P[G.ioffers[0][0]].n} 想賣你一張情報（付 2 資源）</p><p class="hint">${G.ioffers[0][1].t}（${iR(G.ioffers[0][1])}）　<span class="risk">${star(G.ioffers[0][1].s)}</span></p><div class="opts"><button onclick="ioffer(1)" ${m.res<2?'disabled':''}>購買</button><button class="ghost" onclick="ioffer(0)">不買</button></div></div>`:'';
 const k=m.role=='prophet'?2:1,lim=m.role=='prophet'?K.PROPHET_LAST:K.ROUNDS,canPred=G.r<=lim&&m.alive&&G.phase=='act',sp=G.selPred||[];
 const predUI=canPred?`<div class="pred"><p>預測本回合誰會攻擊${k==2?'（最多 2 名）':''}<small>　猜中 +1 VP；他打你時你防禦 +1</small></p><div class="opts">${al().filter(p=>p.i).map(p=>`<button class="chip" aria-pressed="${sp.includes(p.i)}" onclick="togglePred(${p.i})">${p.n}</button>`).join('')}</div></div>`:'';
 const st=(l,v,mx,on)=>`<div${on?` class="vpc${tutWant('score')?' hl':''}" role="button" tabindex="0" onclick="${on}"`:''}><dt>${l}</dt><dd>${v}${mx?`<i style="--p:${Math.min(v,mx)/mx*100}%"></i>`:''}</dd></div>`;
 const fx=ACT_FX(m);const pips=[...Array(Math.max(m.ap,3)).keys()].map(i=>`<span class="${m.alive&&i<m.ap?'on':''}"></span>`).join('');
 const file=`<section class="panel file"><div class="fh"><h2>${GL[m.goal][0]}</h2><span class="tag ${m.alive&&m.hp>1?'':'bad'}">${m.alive?(m.hp<=1?'危險':'存活'):'已淘汰'}</span></div>
  <p class="goal ${UI.goalOpen?'open':''}" onclick="UI.goalOpen=!UI.goalOpen;render()" title="點一下展開或收合">${UI.goalOpen?GL[m.goal][1]:gShort(m.goal)}${m.goal=='guard'?`（守護 ${NM[m.tgt]}）`:''}<small class="more">${UI.goalOpen?'收合':'完整說明'}</small></p><p class="prog">進度：${prog(m)}</p>
  <dl class="stats">${st('生命','<span class="hp">'+HEARTS(m)+'</span>')}${st('分數 ⓘ',vp(m)+'<small> VP</small>',0,'UI.score=1;render()')}${st('資源',RV(m))}${st('信用',m.cred,10)}${st('威脅',m.thr,10)}</dl>${m.ban?`<p class="warn">連續採集後，接下來 ${m.ban} 個行動不能採集</p>`:''}</section>`;
 const act=`<section class="panel actp"><div class="aph"><h2>行動</h2><span class="pips" aria-label="剩餘行動點 ${m.alive?m.ap:0}">${pips}</span></div>
  ${tutHTML()}${m.alive&&G.phase=='act'&&m.ap<1&&[3,4].some(i=>canAct(m,i))?'<p class="hint" style="margin:0 0 6px">AP 用完了，但還有不耗 AP 的技能可以用。</p>':''}<div class="btns">${AC.map((n,i)=>`<button class="ab${tutWant('a'+i)?' hl':''}" ${canAct(m,i)?'':'disabled'} onclick="act(${i})"><b>${n}</b><small><span class="fx">${fx[i]}・</span>${cost(m,i)} AP</small></button>`).join('')}</div>
  <div class="actbody scroll">${stratUI}${sellUI}${G.phase=='act'?pk:''}${off}${predUI}</div>
  <button class="primary endbtn${tutWant('end')?' hl':''}" ${G.phase!='act'||(tutStep()&&!tutWant('end')&&tutStep().need!='done')?'disabled':''} onclick="endTurn()">${m.alive?'結束回合':'觀戰：下一回合'}</button></section>`;
 const views={
  players:`<p class="hint">風險星級是系統估計，不是預言</p><ul class="plist">${G.P.filter(p=>p.i).map(p=>`<li class="${p.alive?'':'out'}"><span class="badge">${p.n}</span><div class="pi"><b>${p.alive?`<span class="hp" aria-label="生命 ${p.hp}">${HEARTS(p)}</span>`:'已淘汰'}${p.an>=2?`　<em class="anom">行為異常（${p.an==3?'高':'中'}）</em>`:''}</b><small>${p.note||'尚未觀察'}</small></div><span class="risk" aria-label="風險 ${p.risk} / 5">${p.alive?star(p.risk):'—'}</span></li>`).join('')}</ul>`,
  intel:`<p class="hint">持有 ${m.hand.length} 張；綠：事實　黃：推測　紅：匿名，可能是假的</p>${G.intel.length?`<ul class="intel" style="margin-top:6px">${G.intel.map(c=>`<li class="k${c.c}"><span>${c.t}<small class="ir">${iR(c)}</small></span><span class="risk">${star(c.s)}</span></li>`).join('')}</ul>`:'<p class="hint">還沒有情報。探索、交易或黑市都能取得。</p>'}`,
  log:`<ol class="logl">${G.log.map(x=>`<li>${x}</li>`).join('')}</ol>`,
  rules:`<p class="win"><b>怎麼贏：</b>${K.ROUNDS} 回合後 VP 最高的人獲勝。完成隱藏目標（5～12 分）和活到最後（5 分）是主要來源。<button class="ghost" onclick="UI.score=1;render()">看我現在幾分</button></p><ul class="rules"><li>每回合 3 AP；攻擊 2 AP，其他行動 1 AP</li><li>每人 ${K.HP_MAX} 點生命，被打中扣 1，歸零淘汰（第 ${K.KILL_FROM} 回合起）</li><li>攻擊值 ${K.ATK_BASE}＋備戰（最多 +${K.BOOST_MAX}）；防禦值 ${K.DEF_BASE}＋防禦次數，防禦可以連按</li><li>打中時搶走對方 ${K.ATK_STEAL} 資源</li><li>連續採集 ${K.COLLECT_STREAK_MAX} 次後，接下來 ${K.COLLECT_BAN} 個行動不能採集</li><li>結算：存活 5、每 ${K.RES_PER_VP} 資源 1、每張情報 ${K.INFO_VP}、擊殺 ${K.KILL_VP}、目標、預測</li><li><button class="ghost" onclick="go('guide');gtab('goals')">查看全部隱藏目標</button></li></ul>`};
 const RT=[['players','玩家'],['intel','情報'],['log','紀錄'],['rules','規則']];
 a.innerHTML=`<div class="game"><div class="gh"><h1>黑箱協議</h1>${track}<span class="rd">第 ${G.r} / ${K.ROUNDS} 回合</span></div>
  <div class="ticker"><span class="ev">${EV[G.r-1]}</span>${G.hunt?'<span class="alert">🔥 有人準備發動獵殺時刻</span>':''}${G.warn?'<span class="alert">全體警示：有人資源 ≥12</span>':''}<span class="lt">${G.log[0]||''}</span></div>
  <div class="body"><div class="left ${UI.tab=='act'?'show':''}">${file}${act}</div>
  <div class="right ${UI.tab!='act'?'show':''}"><section class="panel rpanel"><div class="rtabs">${RT.map(([k,n])=>`<button aria-pressed="${UI.rtab==k}" onclick="setTab('${k}')">${n}</button>`).join('')}</div><div class="rview scroll">${views[UI.rtab]}</div></section></div></div>
  ${scoreHTML()}<nav class="mtabs">${[['act','行動']].concat(RT).map(([k,n])=>`<button aria-pressed="${UI.tab==k}" onclick="setTab('${k}')">${n}${k=='log'&&G.log.length?'':''}</button>`).join('')}</nav></div>`}
init();

if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{})})}
</script></body></html>
